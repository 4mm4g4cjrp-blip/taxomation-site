{{- /* . = Paket aus leistungen.yaml */ -}}
{{- if and hugo.Data.site.showPrices .price -}}
<div class="price num"><span class="ab">ab</span>{{ .price }} €<small>{{ replace .unit "€ " "" }}</small></div>
{{- else -}}
<div class="price" style="font-size:1.6rem">auf Anfrage<small>Fixpreis nach Angebot</small></div>
{{- end -}}
