    text: "Übergabe in der Familie oder Verkauf, steuerlich vorbereitet und begleitet."
  - name: "Betriebsprüfung"
    text: "Vorbereitung, Begleitung und Nachbereitung von Außenprüfungen und Lohnabgabenprüfungen."
  - name: "Finanzstrafrecht"
    text: "Selbstanzeige und Vertretung in Finanzstrafverfahren."
  - name: "Lohnverrechnung Bau (BUAK)"
    text: "Lohnverrechnung für Betriebe, die dem Bauarbeiter-Urlaubs- und Abfertigungsgesetz unterliegen."
  - name: "Größere Lohnverrechnung"
    text: "Für Betriebe mit vielen Dienstnehmer:innen, Schichtmodellen oder mehreren Kollektivverträgen."

# Drei Säulen der Hauptseite
saeulen:
  - icon: "cloud"
    title: "Digital"
    text: "Belege hochladen statt Ordner bringen. Automatisierte Belegverarbeitung, Bankanbindung und Auswertungen online – Ihre Buchhaltung ist laufend aktuell."
  - icon: "sofa"
    title: "Komfort"
    text: "Fixe Monatspreise, klare Leistungsbeschreibung, keine Termine in der Kanzlei nötig. Fristen behalten wir im Blick, Sie erhalten rechtzeitig Bescheid."
  - icon: "chat"
    title: "Service"
    text: "Feste Ansprechpartner:innen, schnelle Bearbeitung und persönliche Prüfung jeder Abgabe durch unsere Mitarbeiter:innen."

ablauf:
  - title: "Anfragen"
    text: "Sie schreiben uns kurz Rechtsform, Branche und ungefähres Belegvolumen. Sie erhalten ein Fixpreis-Angebot."
  - title: "Digital starten"
    text: "Auftrag digital bestätigen, Identität online nachweisen, Zugang zum Upload-Portal einrichten."
  - title: "Belege hochladen"
    text: "Rechnungen und Belege laufend hochladen. Die Belegverarbeitung erfolgt automatisiert."
  - title: "Geprüft und erledigt"
    text: "Unsere Mitarbeiter:innen prüfen jede Abgabe, bevor sie an das Finanzamt geht. Den Stand sehen Sie laufend online."

faq:
  - q: "Erstellt hier eine Software meine Steuererklärung?"
    a: "Nein. Die Belegverarbeitung ist automatisiert, damit Routinearbeit schnell erledigt ist. Jede Abgabe wird von unseren Mitarbeiter:innen geprüft, bevor sie an das Finanzamt geht."
  - q: "Für wen ist Taxomation gedacht?"
    a: "Für Unternehmen in ganz Österreich: Einzelunternehmer:innen, freie Berufe, Gründer:innen, GmbHs, Handels- und Handwerksbetriebe. Private Arbeitnehmerveranlagungen bieten wir nicht an."
  - q: "Was ist im Fixpreis enthalten?"
    a: "Der im Angebot beschriebene Leistungsumfang, etwa laufende Buchhaltung, Voranmeldungen, Jahresabschluss und Erklärungen. Leistungen darüber hinaus vereinbaren wir vorab, zum Beispiel als Fixpreis-Einzelleistung."
  - q: "Wie schnell erhalte ich eine Antwort?"
    a: "Auf Anfragen antworten wir binnen 1 Werktag."
    servicePromise: true
  - q: "Muss ich in die Kanzlei kommen?"
    a: "Nein. Auftrag, Identifizierung, Belegübermittlung und Besprechungen laufen digital, auf Wunsch per Videocall."
  - q: "Können Sie auch komplexere Themen übernehmen?"
    a: "Ja, etwa Holding-Strukturen, Umgründungen, Nachfolge, Betriebsprüfungen oder Lohnverrechnung mit BUAK. Dafür erstellen wir ein individuelles Angebot."
  - q: "Wie wechsle ich von meiner bisherigen Steuerberatung?"
    a: "Mit unserem Kanzleiwechsel-Service: Wir übernehmen die Vollmacht in FinanzOnline, die Vorjahresdaten und die offenen Fristen."

