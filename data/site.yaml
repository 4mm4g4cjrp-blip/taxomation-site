# ─────────────────────────────────────────────────────────────
# Taxomation – zentrale Schalter und Texte der Hauptseite
# Leistungen/Preise: data/leistungen.yaml · Berufsgruppen: data/branchen.yaml
# ─────────────────────────────────────────────────────────────

contactEmail: office@taxomation.at

# Preise (von Andreas am 11.11.2026 bestätigt): true = „ab“-Preise, false = „Preis auf Anfrage“
showPrices: true
priceFootnote: "Alle Preise netto zzgl. 20 % USt. „Ab“-Preise gelten für einen typischen Standardumfang; Ihr Fixpreis richtet sich nach Rechtsform, Belegvolumen und Dienstnehmer:innen."

# Service-Versprechen (von Andreas bestätigt)
showServicePromise: true
servicePromise: "Antwort binnen 1 Werktag"

# Erfahrung – Formulierung (WT-AARL: wahr und belegbar). Werte: neutral | decades | year
#   neutral = „Langjährige Erfahrung in der Steuerberatung“ (Standard, keine Zahl)
#   decades = „Jahrzehnte an Erfahrung in der Steuerberatung“ (erst nach Bestätigung durch Andreas)
#   year    = „Erfahrung in der Steuerberatung seit <foundingYear>“ (nur mit belegtem Jahr)
experienceClaim: neutral
foundingYear: ""          # Platzhalter, bewusst leer
experienceTexts:
  neutral: "Langjährige Erfahrung in der Steuerberatung"
  decades: "Jahrzehnte an Erfahrung in der Steuerberatung"
  year: "Erfahrung in der Steuerberatung seit %s"

# Belegkanal
belegChannelText: "Belege einfach im Upload-Portal hochladen"

# Berufsgruppen-Schalter (Seite wird bei false nicht erzeugt und nirgends verlinkt)
switches:
  showBuakTrades: true     # Zimmerei und andere BUAK-pflichtige Handwerke
  showApotheker: true      # Landingpage Apotheker:innen

# ── Vorbereitete Elemente: standardmäßig AUS, erst mit echten Daten einschalten ──
# Ansprechperson im Hero (Foto unter static/img/, z. B. "img/team/name.jpg")
showPerson: false
person:
  name: ""                # z. B. "Vorname Nachname"
  role: ""                # z. B. "Ihre Ansprechpartnerin"
  photo: ""
# Telefonnummer (Kontaktbereich, Footer, Impressum-Hinweis)
showPhone: false
phone: ""                 # Anzeige, z. B. "+43 …"
phoneHref: ""             # tel:-Format ohne Leerzeichen, z. B. "+43…"
# Termin-Link für ein kurzes Erstgespräch (eigener Dienst, CSP wird nicht berührt – reiner Link)
showBooking: false
bookingUrl: ""
bookingLabel: "Erstgespräch vereinbaren"
# Kontaktformular – nur mit Anbieter + AV-Vertrag einschalten und Datenschutzerklärung ergänzen!
# contactFormAction muss eine https-URL sein; ihre Herkunft wird automatisch in die CSP (form-action) übernommen.
showContactForm: false
contactFormAction: ""

# Betreiberin (Impressum/Datenschutz/JSON-LD/Footer)
operator:
  name: "SCAR Steuerberatung Holding GmbH"
  street: "Hauptplatz 11"
  zip: "7400"
  city: "Oberwart"
  brandLine: "Taxomation – eine Marke der SCAR Steuerberatung Holding GmbH, Oberwart"
