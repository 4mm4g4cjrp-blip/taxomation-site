    lead: "Vertraulich, präzise, digital: Wir führen Ihre Kanzleibuchhaltung so, dass Honorare, Barauslagen und Treuhandgelder sauber getrennt bleiben."
    topics:
      - t: "Treuhand- und Anderkonten"
        d: "Fremdgelder gehören nicht in die eigene Buchhaltung. Wir halten Treuhandkonten klar von Ihren Betriebseinnahmen getrennt."
      - t: "Versorgungseinrichtung der Kammer"
        d: "Beiträge zur Versorgungseinrichtung der Rechtsanwaltskammer werden laufend erfasst und steuerlich berücksichtigt."
      - t: "Honorare und Barauslagen"
        d: "Durchlaufende Posten, Gerichtsgebühren und Honorare werden richtig behandelt – auch in der Umsatzsteuer."
      - t: "Kanzleigründung und Partnerschaft"
        d: "Einzelkanzlei, Partnerschaft oder Rechtsanwalts-GmbH: Wir rechnen die steuerlichen Unterschiede durch."
