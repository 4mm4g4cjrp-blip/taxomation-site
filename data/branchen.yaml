  - slug: aerzte
    name: "Ärzt:innen"
    gruppe: gesundheit
    short: "Ordination, Kassen- und Wahlarztpraxis"
    title: "Steuerberatung für Ärzt:innen – digital"
    description: "Digitale Steuerberatung für Ärzt:innen in Österreich: Ordinationsbuchhaltung, Umsatzsteuer, Wohlfahrtsfonds und Lohn für das Ordinationsteam. Fixpreis, geprüft von unseren Mitarbeiter:innen."
    h1: "Steuerberatung für Ärzt:innen"
    lead: "Ordinationsbuchhaltung, die neben dem Praxisalltag einfach mitläuft: Belege hochladen, wir erledigen Buchhaltung, Erklärungen und Lohn – digital und mit persönlicher Prüfung."
    topics:
      - t: "Kassen- und Wahlarztpraxis"
        d: "Kassenhonorare, Privathonorare und Nebeneinkünfte, etwa aus einer Spitalstätigkeit, werden übersichtlich getrennt erfasst und in der Einkommensteuer zusammengeführt."
      - t: "Umsatzsteuer"
        d: "Heilbehandlungen sind nach § 6 Abs 1 Z 19 UStG unecht steuerbefreit – ohne Vorsteuerabzug. Andere Leistungen, etwa bestimmte Gutachten oder ästhetische Behandlungen ohne therapeutisches Ziel, können steuerpflichtig sein. Wir grenzen das für Sie ab."
      - t: "Ärztekammer und Wohlfahrtsfonds"
        d: "Kammerumlagen und Beiträge zum Wohlfahrtsfonds werden laufend erfasst und steuerlich berücksichtigt."
      - t: "Ordinationsgründung und -übernahme"
        d: "Von der Investitionsplanung über die Abschreibung der Ausstattung bis zur Lohnverrechnung für Ordinationsassistenz."
    paket: epu
    paketText: "Für die Einzelordination mit Einnahmen-Ausgaben-Rechnung, auf Wunsch mit Lohn digital für Ihr Team. Gruppenpraxis als GmbH: Paket GmbH."
    faq:
      - q: "Kann ich als Ärztin oder Arzt Vorsteuer abziehen?"
        a: "Für unecht steuerbefreite Heilbehandlungen grundsätzlich nicht. Erbringen Sie auch steuerpflichtige Leistungen, kann ein anteiliger Vorsteuerabzug möglich sein. Das klären wir im Einzelfall."
      - q: "Betreuen Sie auch Wahlärzt:innen mit wenigen Ordinationstagen?"
        a: "Ja. Gerade bei einer Wahlarztpraxis neben einer Anstellung lohnt sich eine schlanke, digitale Lösung."
      - q: "Wie kommen meine Belege zu Ihnen?"
        a: "Über das Upload-Portal, per Foto oder als PDF. Kontoauszüge können über eine Bankanbindung übernommen werden."

