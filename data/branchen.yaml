    topics:
      - t: "Investitionen und Abschreibung"
        d: "Behandlungseinheiten, Röntgen und Praxiseinrichtung: Wir planen Anschaffungen mit Ihnen und berücksichtigen Abschreibung und Gewinnfreibetrag."
      - t: "Umsatzsteuer"
        d: "Zahnärztliche Heilbehandlungen sind unecht steuerbefreit. Rein ästhetische Leistungen können anders zu beurteilen sein – wir grenzen das ab."
      - t: "Labor- und Fremdleistungen"
        d: "Rechnungen von Dentallaboren und Materialeinkauf werden automatisiert erfasst und den Behandlungen zugeordnet."
      - t: "Praxisteam"
        d: "Lohnverrechnung für Assistenz und Prophylaxe, inklusive Teilzeit und Sonderzahlungen."
