  zielgruppe_dativ: "für Notariate"
  faq_title: "Häufige Fragen von Notar:innen"
  geprueft_am: '2026-11-18'
  topics:
  - t: Treuhandschaften
    d: "Treuhandgelder werden getrennt von der eigenen Buchhaltung geführt. Wir stimmen die Kontenstruktur mit Ihnen ab."
  - t: "Gebühren und Barauslagen"
    d: "Durchlaufende Posten wie Eintragungsgebühren werden korrekt behandelt und nicht als Umsatz erfasst."
  - t: "Berufsständische Versorgung"
    d: "Pflichtbeiträge zur berufsständischen Versorgung werden laufend erfasst und steuerlich berücksichtigt."
  - t: "Team und Notariatskandidat:innen"
    d: "Lohnverrechnung für Ihr Kanzleiteam, inklusive Sonderzahlungen und Jahreserklärungen."
  detail:
  - "Im Notariat fließen laufend Treuhandgelder, Grunderwerbsteuer und Eintragungsgebühren durch die Kanzlei. Diese Beträge sind keine eigenen Einnahmen: Gebühren, die im Namen und auf Rechnung der Klient:innen bezahlt werden, sind durchlaufende Posten ohne Umsatzsteuer. Eigene Barauslagen gehören dagegen zum steuerpflichtigen Entgelt."
  - "Als Freiberufler:innen versteuern Notar:innen nach vereinnahmten Entgelten. Wir stimmen die Kontenstruktur so ab, dass Treuhandbewegungen klar von den Betriebseinnahmen getrennt bleiben."
