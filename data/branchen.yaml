branchen:
- slug: aerzte
  name: "Ärzt:innen"
  gruppe: gesundheit
  short: "Ordination, Kassen- und Wahlarztpraxis"
  title: "Steuerberatung für Ärzt:innen – digital"
  description: "Digitale Steuerberatung für Ärzt:innen in Österreich: Ordinationsbuchhaltung, Umsatzsteuer, Wohlfahrtsfonds und Lohn für das Ordinationsteam. Fixpreis, geprüft von unseren Mitarbeiter:innen."
  h1: "Steuerberatung für Ärzt:innen"
  lead: "Ordinationsbuchhaltung, die neben dem Praxisalltag einfach mitläuft: Belege hochladen, wir erledigen Buchhaltung, Erklärungen und Lohn – digital und mit persönlicher Prüfung."
  zielgruppe_dativ: "für Ärzt:innen"
  faq_title: "Häufige Fragen von Ärzt:innen"
  geprueft_am: '2026-11-18'
  topics:
  - t: "Kassen- und Wahlarztpraxis"
    d: "Kassenhonorare, Privathonorare und Nebeneinkünfte, etwa aus einer Spitalstätigkeit, werden übersichtlich getrennt erfasst und in der Einkommensteuer zusammengeführt."
  - t: Umsatzsteuer
    d: "Heilbehandlungen sind nach § 6 Abs 1 Z 19 UStG unecht steuerbefreit – ohne Vorsteuerabzug. Andere Leistungen, etwa bestimmte Gutachten oder ästhetische Behandlungen ohne therapeutisches Ziel, können steuerpflichtig sein. Wir grenzen das für Sie ab."
  - t: "Ärztekammer und Wohlfahrtsfonds"
    d: "Kammerumlagen und Beiträge zum Wohlfahrtsfonds werden laufend erfasst und als Betriebsausgaben berücksichtigt. Bei einer Anstellung im Spital prüfen wir mögliche Beitragsermäßigungen im Wohlfahrtsfonds."
  - t: "Ordinationsgründung und -übernahme"
    d: "Von der Investitionsplanung über die Abschreibung der Ausstattung bis zur Lohnverrechnung für Ordinationsassistenz."
  - t: Hausapotheke
    d: "Die Abgabe von Medikamenten aus einer ärztlichen Hausapotheke ist keine steuerfreie Heilbehandlung: Sie unterliegt in der Regel 10 % Umsatzsteuer. Dafür steht für die Hausapotheke der Vorsteuerabzug zu; bei gemeinsam genutzten Räumen und Kosten wird er sachgerecht aufgeteilt, oft nach Fläche."
  detail:
  - "Die meisten ärztlichen Umsätze sind nach § 6 Abs 1 Z 19 UStG unecht steuerbefreit. Das bedeutet: keine Umsatzsteuer auf die Honorare, aber auch kein Vorsteuerabzug aus Ordinationseinrichtung, Geräten und Miete. Steuerpflichtig sind dagegen etwa Gutachten ohne therapeutischen Zweck, ästhetische Behandlungen ohne medizinische Indikation und die Medikamentenabgabe aus der Hausapotheke. Gerade für hausapothekenführende Landärzt:innen ist die saubere Trennung der Umsätze und eine nachvollziehbare Vorsteueraufteilung wichtig."
  - "Wer neben einer Spitalsanstellung eine Wahlarztpraxis führt, muss eine Einkommensteuererklärung abgeben, sobald die Nebeneinkünfte 730 € im Jahr übersteigen. Die Lohnsteuer aus dem Dienstverhältnis wird dabei mit dem Ordinationsgewinn zusammengerechnet. Wir planen die Vorauszahlungen so, dass die erste Veranlagung keine Überraschung bringt."
  pakete:
  - epu
  - lohn
  paketText: "Für die Einzelordination mit Einnahmen-Ausgaben-Rechnung das Paket EPU, für Ihr Ordinationsteam zusätzlich Lohn digital. Gruppenpraxis als GmbH: Paket Bilanz."
  faq:
  - q: "Kann ich als Ärztin oder Arzt Vorsteuer abziehen?"
    a: "Für unecht steuerbefreite Heilbehandlungen grundsätzlich nicht. Erbringen Sie auch steuerpflichtige Leistungen, kann ein anteiliger Vorsteuerabzug möglich sein. Das klären wir im Einzelfall."
  - q: "Betreuen Sie auch Wahlärzt:innen mit wenigen Ordinationstagen?"
    a: "Ja. Neben einer Anstellung besteht ab 730 € Nebeneinkünften im Jahr Pflicht zur Einkommensteuererklärung. Wir erledigen sie und planen die Vorauszahlungen."
  - q: "Wie kommen meine Belege zu Ihnen?"
    a: "Über das Upload-Portal, per Foto oder als PDF. Kontoauszüge können über eine Bankanbindung übernommen werden."
  - q: "Muss ich auf Medikamente aus der Hausapotheke Umsatzsteuer verrechnen?"
    a: "In der Regel ja, mit 10 %. Die Abgabe ist keine Heilbehandlung und daher nicht nach § 6 Abs 1 Z 19 UStG befreit. Im Gegenzug können Sie die Vorsteuer aus dem Medikamenteneinkauf abziehen."
- slug: zahnaerzte
  name: "Zahnärzt:innen"
  gruppe: gesundheit
  short: "Praxis, Labor, Investitionen"
  title: "Steuerberatung für Zahnärzt:innen – digital"
  description: "Digitale Steuerberatung für Zahnärzt:innen: Praxisbuchhaltung, Umsatzsteuer, Investitionen und Lohnverrechnung für das Praxisteam. Fixpreis, geprüft von unseren Mitarbeiter:innen."
  h1: "Steuerberatung für Zahnärzt:innen"
  lead: "Hohe Investitionen, ein eingespieltes Team und viele Zahlungsflüsse: Wir halten Ihre Praxiszahlen digital aktuell und geprüft."
  zielgruppe_dativ: "für Zahnärzt:innen"
  faq_title: "Häufige Fragen von Zahnärzt:innen"
  geprueft_am: '2026-11-18'
  topics:
  - t: "Investitionen und Abschreibung"
    d: "Behandlungseinheiten, Röntgen und Praxiseinrichtung: Wir planen Anschaffungen mit Ihnen und berücksichtigen Abschreibung, Gewinnfreibetrag und Investitionsfreibetrag (für Anschaffungen bis 31.12.2026: 20 %)."
  - t: Umsatzsteuer
    d: "Zahnärztliche Heilbehandlungen sind unecht steuerbefreit (§ 6 Abs 1 Z 19 UStG). Auch die Lieferung von Zahnersatz durch Zahnärzt:innen ist befreit (§ 6 Abs 1 Z 20 UStG). Rein ästhetische Leistungen ohne medizinische Indikation können steuerpflichtig sein."
  - t: "Praxislabor und Fremdlabor"
    d: "Ob Zahnersatz im eigenen Praxislabor entsteht oder vom Dentallabor zugekauft wird: Rechnungen und Materialeinkauf werden automatisiert erfasst und den Behandlungen zugeordnet."
  - t: Praxisteam
    d: "Lohnverrechnung für Assistenz und Prophylaxe, inklusive Teilzeit und Sonderzahlungen."
  detail:
  - "Weil Heilbehandlung und Zahnersatz umsatzsteuerfrei sind, gibt es keinen Vorsteuerabzug: Die Umsatzsteuer auf eine neue Behandlungseinheit ist für die Praxis echter Aufwand. Umso wichtiger ist eine Investitionsplanung, die Abschreibung, Gewinnfreibetrag und den derzeit erhöhten Investitionsfreibetrag zusammen betrachtet."
  - "Zahnarztpraxen haben in der Regel ein eingespieltes Team aus Assistenz und Prophylaxe. Lohnverrechnung nach Kollektivvertrag, Teilzeitmodelle und Sonderzahlungen gehören daher meist zum Standardumfang."
  pakete:
  - epu
  - lohn
  paketText: "Für die Einzelpraxis mit Einnahmen-Ausgaben-Rechnung das Paket EPU, ergänzt um Lohn digital für Ihr Team. Gruppenpraxis als GmbH: Paket Bilanz."
  preisHinweis: "Die „ab“-Preise gelten für einen kleinen Standardumfang. Praxen mit Team und hohem Belegvolumen liegen darüber; Ihren Fixpreis erhalten Sie nach einem kurzen Erstgespräch."
  faq:
  - q: "Helfen Sie bei der Finanzierung einer neuen Behandlungseinheit?"
    a: "Wir rechnen die steuerlichen Auswirkungen durch und bereiten die Zahlen für Ihr Bankgespräch auf."
  - q: "Übernehmen Sie auch die Lohnverrechnung für mein Team?"
    a: "Ja, mit Lohn digital – vom ersten Dienstverhältnis an."
  - q: "Kann ich während des Jahres meine Zahlen sehen?"
    a: "Ja. Sie erhalten laufende Auswertungen online."
- slug: tieraerzte
  name: "Tierärzt:innen"
  gruppe: gesundheit
  short: "Kleintier- und Großtierpraxis"
  title: "Steuerberatung für Tierärzt:innen – digital"
  description: "Digitale Steuerberatung für Tierärzt:innen: Umsatzsteuer, Medikamentenlager, Praxisfahrzeuge und Lohnverrechnung. Fixpreis, geprüft von unseren Mitarbeiter:innen."
  h1: "Steuerberatung für Tierärzt:innen"
  lead: "Praxis, Hausbesuche, Medikamente: Wir sorgen dafür, dass Ihre Buchhaltung und Umsatzsteuer stimmen – digital und ohne Papierstapel."
  zielgruppe_dativ: "für Tierärzt:innen"
  faq_title: "Häufige Fragen von Tierärzt:innen"
  geprueft_am: '2026-11-18'
  topics:
  - t: Umsatzsteuer
    d: "Tierärztliche Leistungen sind – anders als Heilbehandlungen am Menschen – grundsätzlich umsatzsteuerpflichtig. Dafür ist der Vorsteuerabzug aus Einkäufen möglich."
  - t: "Medikamente und Lager"
    d: "Einkauf und Abgabe von Tierarzneimitteln werden erfasst, der Lagerbestand zum Jahresende berücksichtigt."
  - t: "Fahrzeuge und Hausbesuche"
    d: "Fahrtenbuch, Kilometergeld oder betriebliches Fahrzeug: Wir wählen mit Ihnen die passende Lösung."
  - t: Registrierkasse
    d: "Bei Barzahlungen in der Praxis prüfen wir die Registrierkassen- und Belegerteilungspflicht."
  detail:
  - "Anders als bei Humanmediziner:innen sind tierärztliche Leistungen umsatzsteuerpflichtig. Das hat auch einen Vorteil: Aus Praxiseinrichtung, Geräten, Medikamenteneinkauf und Fahrzeugen (sofern kein Pkw) ist der Vorsteuerabzug möglich. Für eine kleine Praxis kann die Kleinunternehmerregelung (bis 55.000 € brutto Jahresumsatz) interessant sein – bei hohen Investitionen ist der Verzicht darauf oft günstiger."
  - "Bei Großtierpraxen fallen hohe Fahrleistungen an. Ob Fahrtenbuch mit Kilometergeld oder betriebliches Fahrzeug günstiger ist, rechnen wir für Ihre Zahlen durch."
  pakete:
  - epu
  - lohn
  paketText: "Für die Einzelpraxis mit Einnahmen-Ausgaben-Rechnung; bei angestelltem Team mit Lohn digital."
  faq:
  - q: "Muss ich als Tierärztin Umsatzsteuer verrechnen?"
    a: "In der Regel ja, mit 20 %. Tierärztliche Leistungen sind nicht befreit. Ausnahme ist die Kleinunternehmerregelung: Bis 55.000 € Jahresumsatz (brutto) sind Sie befreit, verlieren dann aber den Vorsteuerabzug."
  - q: "Wie gehe ich mit Barzahlungen um?"
    a: "Wir prüfen, ob eine Registrierkassenpflicht besteht, und sorgen für eine saubere Übernahme der Kassendaten."
  - q: "Betreuen Sie auch Großtierpraxen?"
    a: "Ja. Hohe Fahrleistungen und Medikamentenlager berücksichtigen wir in der laufenden Buchhaltung."
- slug: gesundheitsberufe
  name: Gesundheitsberufe
  gruppe: gesundheit
  short: "Physio-, Ergotherapie, Logopädie, Pflege, Hebammen"
  title: "Steuerberatung für Gesundheitsberufe – digital"
  description: "Digitale Steuerberatung für Physiotherapeut:innen, Ergotherapeut:innen, Logopäd:innen, Pflege und Hebammen: Umsatzsteuer, Sozialversicherung und E/A-Rechnung zum Fixpreis."
  h1: "Steuerberatung für Gesundheitsberufe"
  lead: "Für freiberufliche Therapeut:innen, Pflegepersonen und Hebammen: einfache Buchhaltung, klare Umsatzsteuer, pünktliche Erklärungen."
  zielgruppe_dativ: "für Angehörige der Gesundheitsberufe"
  faq_title: "Häufige Fragen aus den Gesundheitsberufen"
  geprueft_am: '2026-11-18'
  topics:
  - t: Umsatzsteuer
    d: "Heilbehandlungen freiberuflicher Angehöriger der gehobenen medizinisch-technischen Dienste, der Gesundheits- und Krankenpflege, Hebammen sowie Heilmasseur:innen sind nach § 6 Abs 1 Z 19 UStG unecht steuerbefreit. Gewerbliche Masseur:innen fallen nicht darunter, ihre Leistungen sind steuerpflichtig. Kurse oder Trainings ohne therapeutisches Ziel können ebenfalls steuerpflichtig sein."
  - t: "Anstellung und Selbständigkeit"
    d: "Viele arbeiten angestellt und zusätzlich selbständig. Wir führen beide Einkünfte in der Einkommensteuer zusammen."
  - t: Sozialversicherung
    d: "Wir behalten Vorauszahlungen und Nachbemessungen der Sozialversicherung im Blick."
  - t: Praxisgemeinschaft
    d: "Gemeinsame Räume, geteilte Kosten: Wir sorgen für eine nachvollziehbare Aufteilung."
  detail:
  - "Steuerfreie Heilbehandlungen zählen nicht zur Kleinunternehmergrenze von 55.000 €. Wer daneben steuerpflichtige Leistungen erbringt – etwa Präventionskurse, Coaching oder den Verkauf von Produkten –, bleibt für diese Umsätze oft Kleinunternehmer:in und muss keine Umsatzsteuer verrechnen, solange sie 55.000 € brutto im Jahr nicht übersteigen."
  - "Viele Therapeut:innen arbeiten angestellt und zusätzlich selbständig. Beide Einkünfte werden in der Einkommensteuer zusammengeführt; die SVS-Beiträge aus der Selbständigkeit werden nachträglich auf Basis des Gewinns bemessen. Wir schätzen Nachzahlungen rechtzeitig ab."
  pakete:
  - epu
  paketText: "Paket EPU mit Einnahmen-Ausgaben-Rechnung und Einkommensteuererklärung."
  faq:
  - q: "Brauche ich eine Steuerberatung, wenn ich nur nebenbei selbständig bin?"
    a: "Nicht zwingend. Sie spart aber Zeit, und Fehler bei Umsatzsteuer und Sozialversicherung lassen sich vermeiden."
  - q: "Wie hoch sind meine Sozialversicherungs-Nachzahlungen?"
    a: "Wir schätzen sie anhand Ihrer laufenden Zahlen und informieren Sie rechtzeitig."
  - q: "Kann ich alles digital erledigen?"
    a: "Ja, Belege, Auftrag und Besprechungen laufen online."
  - q: "Sind auch Massagen umsatzsteuerfrei?"
    a: "Nur Heilbehandlungen durch Heilmasseur:innen bzw. medizinische Masseur:innen im Rahmen ihrer Berufsberechtigung. Leistungen gewerblicher Masseur:innen sind umsatzsteuerpflichtig, sofern nicht die Kleinunternehmerregelung greift."
- slug: psychotherapie
  name: "Psychotherapie und Psychologie"
  gruppe: gesundheit
  short: "Psychotherapeut:innen, klinische und Gesundheitspsycholog:innen"
  title: "Steuerberatung für Psychotherapeut:innen und Psycholog:innen"
  description: "Digitale Steuerberatung für Psychotherapeut:innen sowie klinische und Gesundheitspsycholog:innen: Umsatzsteuer, E/A-Rechnung, Sozialversicherung. Diskret und digital."
  h1: "Steuerberatung für Psychotherapie und Psychologie"
  lead: "Diskret, digital und unkompliziert: Wir erledigen Buchhaltung und Erklärungen, damit Sie sich auf Ihre Klient:innen konzentrieren können."
  zielgruppe_dativ: "für Psychotherapeut:innen und Psycholog:innen"
  faq_title: "Häufige Fragen aus Psychotherapie und Psychologie"
  geprueft_am: '2026-11-18'
  topics:
  - t: Umsatzsteuer
    d: "Psychotherapie sowie die therapeutische Tätigkeit klinischer und Gesundheitspsycholog:innen sind als Heilbehandlung unecht steuerbefreit (§ 6 Abs 1 Z 19 UStG, für Psycholog:innen laut Umsatzsteuerrichtlinien): keine Umsatzsteuer, aber auch kein Vorsteuerabzug. Supervision, Coaching, Seminare, Firmenberatung oder Eignungstests sind dagegen in der Regel steuerpflichtig."
  - t: "Praxis und Raumkosten"
    d: "Eigene Praxis, Untermiete oder Arbeit von zu Hause: Wir berücksichtigen Miete, Raumkosten und – für 2026 noch – das Arbeitsplatzpauschale."
  - t: "Aus- und Fortbildung"
    d: "Kosten für Fortbildungen und Supervision können steuerlich relevant sein – wir erfassen sie laufend."
  - t: Vertraulichkeit
    d: "Für Belege genügen Rechnungsdaten; Inhalte aus Ihren Sitzungen brauchen wir nicht."
  detail:
  - "Die Steuerbefreiung gilt für die Heilbehandlung, nicht für jede Tätigkeit: Supervision für Kolleg:innen, Lehrtätigkeit, Coaching oder Workshops für Unternehmen sind in der Regel steuerpflichtig. Liegen diese Umsätze unter 55.000 € brutto im Jahr, bleibt es bei der Kleinunternehmerbefreiung – die steuerfreien Therapieumsätze zählen bei dieser Grenze nicht mit."
  - "Wer ohne eigenen Raum außerhalb der Wohnung arbeitet, kann für 2026 noch das Arbeitsplatzpauschale von 1.200 € (bzw. 300 € bei anderen aktiven Einkünften über 13.539 € mit eigenem Arbeitsplatz) geltend machen. Für Wirtschaftsjahre, die ab 1.1.2027 beginnen, entfällt das Pauschale (§ 4 Abs 4 Z 8, § 124b Z 495 EStG); absetzbar bleibt ergonomisches Mobiliar bis 300 € im Jahr."
  pakete:
  - epu
  paketText: "Paket EPU mit Einnahmen-Ausgaben-Rechnung und Einkommensteuererklärung."
  faq:
  - q: "Ist Supervision umsatzsteuerfrei?"
    a: "In der Regel nicht. Supervision ist keine Heilbehandlung und daher grundsätzlich steuerpflichtig, die Umsatzsteuerrichtlinien nehmen sie bei Psycholog:innen ausdrücklich von der Befreiung aus. Bis 55.000 € brutto Jahresumsatz aus steuerpflichtigen Leistungen greift aber die Kleinunternehmerbefreiung."
  - q: "Ich bin in Ausbildung unter Supervision. Betreuen Sie mich schon?"
    a: "Ja. Gerade am Anfang hilft eine klare Struktur bei Belegen und Erklärungen."
  - q: "Wie vertraulich ist der Upload?"
    a: "Wir unterliegen der beruflichen Verschwiegenheitspflicht. Hochgeladen werden nur Rechnungen und Zahlungsbelege."
  - q: "Kann ich meinen Arbeitsplatz zu Hause absetzen?"
    a: "Für 2026 noch über das Arbeitsplatzpauschale (1.200 € bzw. 300 €), wenn Ihnen kein anderer Raum außerhalb der Wohnung zur Verfügung steht. Für Wirtschaftsjahre ab 1.1.2027 entfällt das Pauschale; ergonomisches Mobiliar bleibt bis 300 € im Jahr absetzbar."
- slug: apotheker
  name: "Apotheker:innen"
  gruppe: gesundheit
  switch: showApotheker
  short: "Öffentliche Apotheke, Warenlager, Team"
  title: "Steuerberatung für Apotheker:innen – digital"
  description: "Digitale Steuerberatung für Apotheken in Österreich: Warenlager und Inventur, Wareneinsatz, Umsatzsteuer, Lohnverrechnung und Jahresabschluss."
  h1: "Steuerberatung für Apotheker:innen"
  lead: "Viele Artikel, viele Zahlungen, ein großes Team: Wir bringen Warenwirtschaft, Buchhaltung und Lohn in einen klaren, digitalen Ablauf."
  zielgruppe_dativ: "für Apotheken"
  faq_title: "Häufige Fragen von Apotheker:innen"
  geprueft_am: '2026-11-18'
  topics:
  - t: "Warenlager und Inventur"
    d: "Wareneinsatz, Lagerbewertung und Inventur zum Stichtag – abgestimmt mit den Daten aus Ihrer Warenwirtschaft."
  - t: Umsatzsteuer
    d: "Arzneimittel unterliegen 10 % Umsatzsteuer, Drogerie- und Kosmetikartikel in der Regel 20 %. Wir sorgen für die richtige Zuordnung in Kassa und Buchhaltung."
  - t: Lohnverrechnung
    d: "Pharmazeut:innen, PKA und Teilzeitkräfte – inklusive der Besonderheiten bei der Abrechnung über die Pharmazeutische Gehaltskasse."
  - t: "Konzession und Übernahme"
    d: "Öffentliche Apotheken werden meist als Einzelunternehmen, OG oder KG geführt. Bei Gründung, Übernahme oder Beteiligung begleiten wir die steuerlichen Fragen und die Wahl der Rechtsform."
  detail:
  - "In der Apotheke treffen zwei Steuersätze an einer Kassa zusammen: 10 % für Arzneimittel und 20 % für Drogerie, Kosmetik und Nahrungsergänzung. Eine saubere Warengruppenzuordnung in der Warenwirtschaft ist die Voraussetzung für richtige Voranmeldungen."
  - "Das Warenlager ist in der Apotheke oft der größte Bilanzposten. Inventur und Bewertung zum Stichtag bestimmen den Wareneinsatz und damit den Gewinn – wir stimmen die Daten aus Ihrem Warenwirtschaftssystem mit der Buchhaltung ab."
  pakete:
  - bilanz
  - lohn
  paketText: "Für bilanzierende Apotheken das Paket Bilanz (doppelte Buchhaltung und Jahresabschluss), ergänzt um Lohn digital. Der Fixpreis richtet sich nach Belegvolumen und Teamgröße."
  preisHinweis: "Für Apotheken erstellen wir den Fixpreis nach einem kurzen Erstgespräch; die „ab“-Preise gelten für kleinere Betriebe."
  faq:
  - q: "Übernehmen Sie die Daten aus unserer Warenwirtschaft?"
    a: "Wir stimmen mit Ihnen ab, welche Auswertungen wir benötigen, und übernehmen sie digital."
  - q: "Betreuen Sie auch die Übernahme einer Apotheke?"
    a: "Ja, mit einem individuellen Angebot für Planung, Finanzierungsunterlagen und steuerliche Struktur."
  - q: "Wie wird die Lohnverrechnung abgerechnet?"
    a: "Lohn digital wird je Dienstnehmer:in und Monat abgerechnet. Für größere Teams erstellen wir ein eigenes Angebot."
- slug: rechtsanwaelte
  name: "Rechtsanwält:innen"
  gruppe: freieberufe
  short: "Kanzlei, Treuhandgelder, Versorgung"
  title: "Steuerberatung für Rechtsanwält:innen – digital"
  description: "Digitale Steuerberatung für Rechtsanwält:innen: Trennung von Treuhandgeldern, Versorgungseinrichtung, Umsatzsteuer und Kanzleibuchhaltung. Vertraulich, Fixpreis."
  h1: "Steuerberatung für Rechtsanwält:innen"
  lead: "Vertraulich, präzise, digital: Wir führen Ihre Kanzleibuchhaltung so, dass Honorare, Barauslagen und Treuhandgelder sauber getrennt bleiben."
  zielgruppe_dativ: "für Rechtsanwält:innen"
  faq_title: "Häufige Fragen von Rechtsanwält:innen"
  geprueft_am: '2026-11-18'
  topics:
  - t: "Treuhand- und Anderkonten"
    d: "Fremdgelder gehören nicht in die eigene Buchhaltung. Wir halten Treuhandkonten klar von Ihren Betriebseinnahmen getrennt."
  - t: "Versorgungseinrichtung der Kammer"
    d: "Beiträge zur Versorgungseinrichtung der Rechtsanwaltskammer werden laufend erfasst und steuerlich berücksichtigt."
  - t: "Honorare und Barauslagen"
    d: "Barauslagen wie Fahrtspesen oder Kopien sind Teil Ihres Entgelts und mit 20 % Umsatzsteuer zu verrechnen. Nur Beträge, die Sie im Namen und auf Rechnung Ihrer Mandant:innen bezahlen – etwa Gerichtsgebühren –, sind durchlaufende Posten ohne Umsatzsteuer."
  - t: "Kanzleigründung und Partnerschaft"
    d: "Einzelkanzlei, Partnerschaft oder Rechtsanwalts-GmbH: Wir rechnen die steuerlichen Unterschiede durch."
  detail:
  - "Rechtsanwält:innen versteuern als Freiberufler:innen nach vereinnahmten Entgelten (§ 17 UStG): Die Umsatzsteuer wird erst mit Zahlungseingang fällig. Treuhandgelder sind keine Betriebseinnahmen und werden getrennt geführt."
  - "In der Honorarnote ist die Trennung wichtig: Eigene Barauslagen wie Reisekosten, Kopien oder Porto erhöhen das steuerpflichtige Entgelt. Durchlaufende Posten im Sinne des § 4 Abs 3 UStG – etwa im Namen der Mandant:innen entrichtete Gerichtsgebühren – werden ohne Umsatzsteuer weiterverrechnet."
  pakete:
  - epu
  - lohn
  paketText: "Für die Einzelkanzlei mit Einnahmen-Ausgaben-Rechnung das Paket EPU, für Ihr Kanzleiteam zusätzlich Lohn digital. Rechtsanwalts-GmbH oder größere Kanzlei: Paket Bilanz."
  faq:
  - q: "Wie gehen Sie mit Treuhandgeldern um?"
    a: "Treuhandkonten werden getrennt geführt und nicht als Betriebseinnahmen erfasst. Wir stimmen die Kontenzuordnung zu Beginn mit Ihnen ab."
  - q: "Muss ich Umsatzsteuer nach Zahlungseingang abführen?"
    a: "Freiberufler:innen versteuern grundsätzlich nach vereinnahmten Entgelten (§ 17 UStG). Wir berücksichtigen das in Ihren Voranmeldungen."
  - q: "Sind meine Mandantendaten beim Upload geschützt?"
    a: "Wir benötigen nur Rechnungs- und Zahlungsbelege. Für alle Daten gilt unsere berufliche Verschwiegenheitspflicht."
  - q: "Muss ich auf Barauslagen Umsatzsteuer verrechnen?"
    a: "Auf eigene Barauslagen wie Fahrtkosten oder Kopien ja, sie gehören zum Entgelt. Gerichtsgebühren, die Sie im Namen und auf Rechnung der Mandant:innen bezahlen, sind durchlaufende Posten und bleiben ohne Umsatzsteuer."
- slug: notare
