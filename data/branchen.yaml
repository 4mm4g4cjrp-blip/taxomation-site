  - q: "Wie läuft der Wechsel zu Taxomation?"
    a: "Mit dem Kanzleiwechsel-Service: Vollmacht, Vorjahresdaten und offene Fristen übernehmen wir für Sie."
  - q: "Kann die Lohnverrechnung mit wachsen?"
